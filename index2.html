<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Engineering Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1419;
      color: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0f1419 100%);
      z-index: 0;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(83, 232, 139, 0.1) 0%, transparent 50%),
                  radial-gradient(circle, rgba(255, 70, 85, 0.1) 0%, transparent 50%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #53e88b;
      transform: translateX(-5px);
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .header h1 {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #53e88b 0%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }

    .header h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #53e88b, #2dd4bf);
    }

    .header p {
      font-size: 1.2rem;
      color: #8b92a8;
      font-weight: 500;
    }

    .progress-bar {
      width: 100%;
      height: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #53e88b, #2dd4bf);
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 1.1rem;
    }

    .section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .section:hover {
      border-color: rgba(83, 232, 139, 0.5);
      transform: translateY(-2px);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title svg {
      width: 28px;
      height: 28px;
      stroke: #53e88b;
    }

    .section-progress {
      font-size: 1.2rem;
      color: #53e88b;
      font-weight: 700;
      background: rgba(83, 232, 139, 0.1);
      padding: 8px 16px;
      border-radius: 8px;
    }

    .topics {
      display: grid;
      gap: 12px;
    }

    .topic {
      display: flex;
      align-items: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .topic:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(83, 232, 139, 0.3);
      transform: translateX(5px);
    }

    .topic input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-right: 15px;
      cursor: pointer;
      accent-color: #53e88b;
    }

    .topic label {
      cursor: pointer;
      flex: 1;
      font-size: 1.05rem;
      color: #d1d5db;
      line-height: 1.5;
    }

    .topic.completed {
      opacity: 0.6;
    }

    .topic.completed label {
      text-decoration: line-through;
      color: #6b7280;
    }

    /* Added user info and logout button styles */
    .user-info {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 1000;
    }

    .user-info.hidden {
      display: none;
    }

    .user-info .username {
      color: #53e88b;
      font-weight: 600;
    }

    .logout-btn {
      background: rgba(255, 70, 85, 0.2);
      border: 1px solid rgba(255, 70, 85, 0.5);
      color: #ff4655;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 70, 85, 0.3);
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 2.5rem;
      }

      .section {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="grid-overlay"></div>
  
  <!-- Added user info display -->
  <div class="user-info hidden" id="user-info">
    <span class="username" id="display-username"></span>
    <button class="logout-btn" id="logout-btn">Logout</button>
  </div>
  
  <div class="container">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Hub
    </button>
    
    <div class="header">
      <h1>ML Engineering Portal</h1>
      <p>Master Machine Learning for MAANG Internships</p>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="overall-progress">0%</div>
    </div>

    <div id="sections-container"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script>
    let db = null;
    let currentUser = null;

    async function initDatabase() {
      const SQL = await initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
      });

      const savedDb = localStorage.getItem('progressDB');
      if (savedDb) {
        const uint8Array = new Uint8Array(JSON.parse(savedDb));
        db = new SQL.Database(uint8Array);
      } else {
        window.location.href = 'index.html';
        return;
      }
    }

    function saveDatabase() {
      const data = db.export();
      const buffer = Array.from(data);
      localStorage.setItem('progressDB', JSON.stringify(buffer));
    }

    const mlData = {
      "Programming & Software Engineering": [
        "Python (syntax, data structures, libraries)",
        "Data Structures & Algorithms (for coding interviews)",
        "Version Control (Git, GitHub)",
        "Unix / command line basics",
        "Software engineering best practices (clean code, modularity, testing)"
      ],
      "Mathematics & Statistics": [
        "Linear Algebra (vectors, matrices, eigen decomposition, dot product)",
        "Calculus (derivatives, gradients, partial derivatives, chain rule)",
        "Probability & Statistics (distributions, Bayes theorem, expectation, variance, hypothesis testing)",
        "Optimization (gradient descent, convex vs nonconvex, regularization)"
      ],
      "Data Handling & Preprocessing": [
        "Data cleaning (missing values, outliers, duplicates)",
        "Feature engineering & feature selection",
        "Dimensionality reduction (PCA, SVD)",
        "Building data pipelines / ETL basics"
      ],
      "Machine Learning Fundamentals": [
        "Linear Regression, Logistic Regression",
        "Decision Trees, Random Forests",
        "Support Vector Machines, k-NN",
        "Ensemble methods (boosting, bagging, gradient boosting)",
        "Clustering (K-means, hierarchical)",
        "Dimensional methods, anomaly detection"
      ],
      "Model Evaluation & Validation": [
        "Bias-variance tradeoff",
        "Cross-validation (k-fold, hold-out)",
        "Metrics (accuracy, precision, recall, F1, ROC-AUC)",
        "Confusion matrix, error analysis"
      ],
      "Deep Learning": [
        "Neural network basics (MLP, activation functions, backpropagation)",
        "Convolutional Neural Networks (CNNs)",
        "Recurrent Neural Networks (RNNs, LSTM, GRU)",
        "Transformer architectures / attention",
        "Transfer learning, pretrained models"
      ],
      "Frameworks & Tools": [
        "PyTorch or TensorFlow (deep learning)",
        "Keras (optional, high-level API)",
        "scikit-learn (classical ML)",
        "pandas, numpy (data handling)",
        "matplotlib, seaborn (data visualization)"
      ],
      "Deployment / MLOps": [
        "Docker (containerization)",
        "REST APIs (Flask / FastAPI)",
        "Model serving (TorchServe, TensorFlow Serving)",
        "Experiment tracking (MLflow, Weights & Biases)",
        "CI/CD pipelines (basics)",
        "Cloud platforms (AWS / GCP / Azure basics)",
        "Monitoring & logging ML models"
      ],
      "Advanced / Optional": [
        "Reinforcement Learning",
        "Graph Neural Networks",
        "Generative Models (GANs, VAEs)",
        "Unsupervised & self-supervised learning",
        "Bayesian methods & causal inference",
        "AutoML & hyperparameter tuning",
        "Distributed training (multi-GPU)",
        "Explainability / interpretability",
        "Fairness, ethics & privacy in ML"
      ]
    };

    const sectionIcons = {
      "Programming & Software Engineering": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
      "Mathematics & Statistics": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"></path><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path></svg>',
      "Data Handling & Preprocessing": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>',
      "Machine Learning Fundamentals": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>',
      "Model Evaluation & Validation": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>',
      "Deep Learning": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>',
      "Frameworks & Tools": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>',
      "Deployment / MLOps": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
      "Advanced / Optional": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>'
    };

    function initializeProgress() {
      currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (!currentUser) {
        window.location.href = 'index.html';
        return {};
      }
      
      document.getElementById('user-info').classList.remove('hidden');
      document.getElementById('display-username').textContent = currentUser.username;
      
      const progressKey = `user_${currentUser.id}_progress`;
      const saved = localStorage.getItem(progressKey);
      return saved ? JSON.parse(saved) : {};
    }

    let progress = initializeProgress();

    document.getElementById('logout-btn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    function saveProgress() {
      if (!currentUser) return;
      
      if (db) {
        Object.keys(progress).forEach(topic => {
          // Use topic name directly as task_id for portal tasks
          db.run(`INSERT OR REPLACE INTO progress (user_id, task_id, completed) VALUES (?, ?, ?)`,
            [currentUser.id, topic, progress[topic] ? 1 : 0]);
        });
        saveDatabase();
      }
      
      const progressKey = `user_${currentUser.id}_progress`;
      localStorage.setItem(progressKey, JSON.stringify(progress));
      updateOverallProgress();
      
      window.dispatchEvent(new Event('storage'));
    }

    function updateOverallProgress() {
      let total = 0;
      let completed = 0;

      Object.keys(mlData).forEach(section => {
        mlData[section].forEach(topic => {
          total++;
          if (progress[topic]) completed++;
        });
      });

      const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
      document.getElementById('overall-progress').style.width = percentage + '%';
      document.getElementById('overall-progress').textContent = percentage + '%';
      
      if (currentUser) {
        localStorage.setItem(`portal_ml_progress_${currentUser.id}`, JSON.stringify({
          percentage,
          completed,
          total
        }));
      }
      
      window.dispatchEvent(new CustomEvent('portalProgressUpdate', { 
        detail: { portal: 'ml', percentage, completed, total } 
      }));
    }

    function playTaskCompleteSound() {
      const sound = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGGS57OihUBELTKXh8bllHAU2jdXvzn0vBSh+zPDajzsKElyx6OyrWBUIQ5zd8sFuJAUuhM/z24k2Bhxqu+zpoVARC0yl4fG5ZRwFNo3V7859LwUofsz');
      sound.play().catch(e => console.log('Sound play failed:', e));
    }

    function renderSections() {
      const container = document.getElementById('sections-container');
      container.innerHTML = '';

      Object.keys(mlData).forEach((sectionName, index) => {
        const section = document.createElement('div');
        section.className = 'section';

        const topics = mlData[sectionName];
        const completedCount = topics.filter(t => progress[t]).length;
        const sectionProgress = `${completedCount}/${topics.length}`;

        section.innerHTML = `
          <div class="section-header">
            <div class="section-title">
              ${sectionIcons[sectionName] || ''}
              ${sectionName}
            </div>
            <div class="section-progress">${sectionProgress}</div>
          </div>
          <div class="topics" id="topics-${index}"></div>
        `;

        container.appendChild(section);

        const topicsContainer = document.getElementById(`topics-${index}`);
        topics.forEach(topic => {
          const topicDiv = document.createElement('div');
          topicDiv.className = 'topic' + (progress[topic] ? ' completed' : '');

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.id = `topic-${topic}`;
          checkbox.checked = progress[topic] || false;
          checkbox.addEventListener('change', (e) => {
            progress[topic] = e.target.checked;
            if (e.target.checked) {
              playTaskCompleteSound();
            }
            saveProgress();
            renderSections();
          });

          const label = document.createElement('label');
          label.htmlFor = `topic-${topic}`;
          label.textContent = topic;

          topicDiv.appendChild(checkbox);
          topicDiv.appendChild(label);
          topicsContainer.appendChild(topicDiv);
        });
      });
    }

    renderSections();
    updateOverallProgress();

    initDatabase();
  </script>
</body>
</html>
